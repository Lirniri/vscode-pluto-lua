<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256">
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a8ff"/>
      <stop offset="0.5" stop-color="#8b4fe0"/>
      <stop offset="1" stop-color="#4a1fa0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#6a3fd0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1aa8"/>
      <stop offset="0.55" stop-color="#2f5be0"/>
      <stop offset="1" stop-color="#5ab4ff"/>
    </linearGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5a6cff"/>
      <stop offset="0.5" stop-color="#0a0a9a"/>
      <stop offset="1" stop-color="#000080"/>
    </radialGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-100" y="-100" width="200" height="200">
      <rect x="-100" y="-100" width="200" height="200" fill="#fff"/>
      <path d="M-80 0 A80 21 0 0 0 80 0" fill="none" stroke="#000" stroke-width="17"/>
    </mask>
      <linearGradient id="tp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a8ff"/><stop offset="1" stop-color="#7a45dc"/></linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1aa8"/><stop offset="0.55" stop-color="#2f5be0"/><stop offset="1" stop-color="#5ab4ff"/></linearGradient>
  </defs>
  <circle cx="128" cy="128" r="100" fill="none" stroke="url(#orbit)" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 14.5"/>
  <g transform="translate(120 134) rotate(-22)">
    <ellipse rx="80" ry="21" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <circle r="50" fill="url(#planet)" mask="url(#cut)"/>
    <circle cx="24" cy="-24" r="9" fill="#fff" opacity=".92" mask="url(#cut)"/>
    <path d="M-80 0 A80 21 0 0 0 80 0" fill="none" stroke="url(#ring)" stroke-width="9"/>
  </g>
  <circle cx="199" cy="57" r="19" fill="url(#moon)"/>
  <circle cx="199" cy="57" r="19" fill="none" stroke="#7fa0ff" stroke-width="1.5" opacity=".6"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="104">
    <text x="276" y="120" fill="url(#tp)">Pluto</text>
    <text x="276" y="222" fill="url(#tl)">Lua</text>
  </g>
</svg>